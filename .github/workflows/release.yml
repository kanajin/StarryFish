name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check public source boundaries
        run: py -3.12 -B tools/privacy_scan.py
      - name: Fetch verified official dependencies
        run: py -3.12 -B tools/fetch_dependencies.py
      - name: Build native host and installer
        working-directory: hosts/webview2
        run: py -3.12 -B build.py build
      - name: Run isolated checks
        working-directory: hosts/webview2
        run: py -3.12 -B build.py test
      - name: Verify and stage installer
        working-directory: hosts/webview2
        run: |
          py -3.12 -B build.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.12 -B build.py package-setup
      - name: Create release archives and checksums
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TYPE -eq 'tag') { $version = $env:RELEASE_REF.Substring(1) }
          py -3.12 -B tools/package_release.py $version
      - name: Keep build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StarryFish-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/* --verify-tag --draft --title "StarryFish $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false
