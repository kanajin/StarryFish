<title>StarryFish 游戏准备</title>
<style>body{font:16px 'Segoe UI',sans-serif;padding:24px;line-height:1.6}</style>
<h1>准备进入 GBF</h1>
<p>先启动你自己的 acgpower，再从上方「代理」选择 acgpower。确认代理生效后，游戏会在这里打开。</p>
<p>右侧「功能」中的太郎、肉鸽按钮分别打开或关闭助手；肉鸽也可拆成独立窗口。「双窗」可以并排显示两个等宽游戏页面。</p>
<p>这是轻量宿主的独立资料，保留原有 CEF 资料。Mobage 邮箱、密码和验证码由你本人输入。</p>
<h2>内置书签与汉化</h2>
<p>在 GBF 游戏页自动运行，设置保存在当前资料。离线验证模式不开放游戏网络。</p>
<p>脚本代码随 StarryFish 包更新；汉化译文、样式及可选翻译服务仍需联网。</p>
